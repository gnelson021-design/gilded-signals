# GS Weekly Automation — the permanent weekly cycle (America/Chicago).
#
# GitHub cron is UTC-only, so every job has a CST slot and a CDT slot; the
# gate step checks real Central Time and skips the wrong one. Catch-up slots
# recover a missed or late run. Publish/freeze are write-once and skip if
# already done, so repeats are harmless.
#
# SHADOW MODE: publishes to GS_PUBLISH_BRANCH (default automation/dev), which
# only the Netlify branch preview shows. Publishing to main additionally
# requires the repository variable GS_PRODUCTION_APPROVED = yes.
#
# Note: GitHub runs scheduled workflows only from the DEFAULT branch, so this
# file must exist on main for the crons to fire. It checks out and publishes
# to GS_PUBLISH_BRANCH; it does not change any site file on main.
name: GS Weekly Automation

on:
  schedule:
    - cron: "0 22 * * 5"    # friday-close   Fri 16:00 CST
    - cron: "0 21 * * 5"    # friday-close   Fri 16:00 CDT
    - cron: "10 14 * * 6"   # friday-close   catch-up Sat 08:10 CST
    - cron: "10 13 * * 6"   # friday-close   catch-up Sat 08:10 CDT
    - cron: "5 17 * * 6"    # friday-close   final catch-up Sat 11:05 CST (alerts if still not frozen)
    - cron: "5 16 * * 6"    # friday-close   final catch-up Sat 11:05 CDT
    - cron: "0 15 * * 6"    # saturday       Sat 09:00 CST
    - cron: "0 14 * * 6"    # saturday       Sat 09:00 CDT
    - cron: "0 21 * * 0"    # sunday-validate Sun 15:00 CST
    - cron: "0 20 * * 0"    # sunday-validate Sun 15:00 CDT
    - cron: "0 0 * * 1"     # sunday-publish Sun 18:00 CST
    - cron: "0 23 * * 0"    # sunday-publish Sun 18:00 CDT
    - cron: "0 13 * * 1"    # sunday-publish catch-up Mon 07:00 CST
    - cron: "0 12 * * 1"    # sunday-publish catch-up Mon 07:00 CDT
    - cron: "15 13 * * *"   # health         daily 07:15 CST
    - cron: "15 12 * * *"   # health         daily 07:15 CDT
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options: [saturday, sunday-validate, sunday-publish, friday-close, health]
      force:
        description: "Ignore the time window (write-once guards still apply)"
        required: false
        type: boolean
        default: false

concurrency:
  group: gs-schedule
  cancel-in-progress: false

permissions:
  contents: write

env:
  GS_PUBLISH_BRANCH: ${{ vars.GS_PUBLISH_BRANCH || 'automation/dev' }}
  GS_PRODUCTION_APPROVED: ${{ vars.GS_PRODUCTION_APPROVED }}
  GS_SCORECARD_BASE: ${{ vars.GS_SCORECARD_BASE }}
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.GS_PUBLISH_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Resolve job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force }}" = "true" ]; then echo "force=--force" >> "$GITHUB_OUTPUT"; else echo "force=" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "0 22 * * 5"|"0 21 * * 5"|"10 14 * * 6"|"10 13 * * 6"|"5 17 * * 6"|"5 16 * * 6") J=friday-close ;;
            "0 15 * * 6"|"0 14 * * 6") J=saturday ;;
            "0 21 * * 0"|"0 20 * * 0") J=sunday-validate ;;
            "0 0 * * 1"|"0 23 * * 0"|"0 13 * * 1"|"0 12 * * 1") J=sunday-publish ;;
            "15 13 * * *"|"15 12 * * *") J=health ;;
            *) echo "unknown schedule ${{ github.event.schedule }}"; exit 1 ;;
          esac
          echo "name=$J" >> "$GITHUB_OUTPUT"
          echo "force=" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: node --test engine/test/engine.test.js engine/test/schedule.test.js test/site/auto-pages.test.js

      - name: Gate (Central Time window + write-once state)
        id: gate
        run: node engine/schedule.js gate "${{ steps.job.outputs.name }}" ${{ steps.job.outputs.force }}

      - name: Research run
        if: steps.gate.outputs.run == 'true' && (steps.job.outputs.name == 'saturday' || steps.job.outputs.name == 'sunday-validate' || steps.job.outputs.name == 'sunday-publish')
        run: node engine/run.js --out engine-out/run

      - name: Backtest (Saturday only)
        if: steps.gate.outputs.run == 'true' && steps.job.outputs.name == 'saturday'
        run: node engine/backtest.js --inputs engine-out/run/inputs.json --out engine-out/run --symbols 400 --weeks 52

      - name: Publish (write-once, READY briefs only)
        id: publish
        if: steps.gate.outputs.run == 'true' && steps.job.outputs.name == 'sunday-publish'
        run: node engine/schedule.js publish --run engine-out/run

      - name: Freeze Friday results (write-once)
        id: freeze
        if: steps.gate.outputs.run == 'true' && steps.job.outputs.name == 'friday-close'
        run: node engine/schedule.js freeze

      - name: Health check
        if: steps.gate.outputs.run == 'true' && steps.job.outputs.name == 'health'
        run: node engine/schedule.js health

      - name: Commit published data
        if: steps.publish.outputs.files != '' || steps.freeze.outputs.files != ''
        run: |
          git config user.name "gs-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.publish.outputs.files }} ${{ steps.freeze.outputs.files }}
          git commit -m "auto(${{ steps.job.outputs.name }}): week of ${{ steps.publish.outputs.weekOf }}${{ steps.freeze.outputs.weekOf }}"
          for i in 1 2 3; do
            if git push origin "HEAD:${GS_PUBLISH_BRANCH}"; then exit 0; fi
            git pull --rebase origin "${GS_PUBLISH_BRANCH}"; sleep 5
          done
          echo "push failed after 3 attempts"; exit 1

      - name: Upload run output
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: gs-${{ steps.job.outputs.name }}-${{ github.run_id }}
          path: engine-out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        run: |
          node engine/schedule.js alert "Workflow failed - ${{ steps.job.outputs.name }}" "A step failed. No published or frozen file was overwritten. ${GITHUB_RUN_URL}"
