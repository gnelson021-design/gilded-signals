[build]
  functions = "netlify/functions"

[[edge_functions]]
  path = "/data/*"
  function = "protect-picks-data"

# /api/* → /.netlify/functions/*
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Official weekly-briefing trigger capture — every 15 minutes, weekdays,
# spanning US regular market hours in UTC across both EDT and EST.
[functions."trigger-capture"]
  schedule = "*/15 13-21 * * 1-5"
