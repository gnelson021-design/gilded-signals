[build]
  functions = "netlify/functions"

[[edge_functions]]
  path = "/data/*"
  function = "protect-picks-data"

# /api/* → /.netlify/functions/*
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Weekly trigger capture (trigger-capture.js) was RETIRED with the weekly
# format in Nov 2026 — its schedule is intentionally removed. The function and
# the gs-trigger-ledger store remain so archived weekly records still resolve.
# The Daily Top 20 has no scheduled Netlify function.
