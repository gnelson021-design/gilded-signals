[build]
  functions = "netlify/functions"

[[edge_functions]]
  path = "/data/*"
  function = "protect-picks-data"

# /api/* → /.netlify/functions/*
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
